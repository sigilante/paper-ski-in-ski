<style>
.cap{font-size:13px;color:var(--text-secondary);text-align:center;margin-top:4px}
.pan{border:0.5px solid var(--border);border-radius:12px;padding:6px}
.leg{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--text-secondary);margin-top:12px;align-items:center}
.leg span{display:inline-flex;align-items:center;gap:6px}
</style>
<h2 class="sr-only">Direction B: typed-leaf Zantema spirals for S K K x and a larger scrubbable S K term</h2>
<div style="padding:0.5rem 0">
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
<div><div class="pan"><svg id="p0" width="100%" style="height:140px;display:block"></svg></div><div class="cap">t = 0 &middot; S K K x</div></div>
<div><div class="pan"><svg id="p1" width="100%" style="height:140px;display:block"></svg></div><div class="cap">t = 1 &middot; K x (K x)</div></div>
<div><div class="pan"><svg id="p2" width="100%" style="height:140px;display:block"></svg></div><div class="cap">t = 2 &middot; x</div></div>
</div>
<div class="pan" style="margin-top:16px"><svg id="big" width="100%" style="height:360px;display:block"></svg></div>
<div style="display:flex;align-items:center;gap:12px;margin-top:10px;font-size:13px;color:var(--text-secondary)">
<span>Step</span>
<input type="range" id="st" min="0" max="0" value="0" style="flex:1" aria-label="Reduction step">
<span id="ro" style="min-width:150px;text-align:right">&nbsp;</span>
</div>
<div class="leg">
<span><svg width="26" height="12" aria-hidden="true"><line x1="1" y1="6" x2="25" y2="6" stroke="#639922" stroke-width="2"/></svg>Function edge</span>
<span><svg width="26" height="12" aria-hidden="true"><line x1="1" y1="6" x2="25" y2="6" stroke="#378ADD" stroke-width="2"/></svg>Argument edge</span>
<span><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="4" fill="#D85A30"/></svg>S</span>
<span><svg width="16" height="12" aria-hidden="true"><rect x="1" y="4" width="14" height="4" fill="#D85A30"/></svg>K</span>
<span><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="4" fill="none" stroke="#D85A30" stroke-width="1.5"/></svg>I</span>
<span><svg width="12" height="12" aria-hidden="true"><rect x="2" y="2" width="8" height="8" fill="#888780"/></svg>Variable</span>
<span><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="4" fill="none" stroke="var(--text-secondary)" stroke-width="1"/></svg>Root</span>
</div>
</div>
<script>
const TF=25*Math.PI/180, TA=65*Math.PI/180, RF=0.9, RA=0.55;
function parse(s){let i=0;function seq(){let t=null;while(i<s.length&&s[i]!==')'){let u;if(s[i]==='('){i++;u=seq();i++;}else{u=s[i];i++;}t=t===null?u:[t,u];}return t;}return seq();}
function spine(t){const a=[];while(Array.isArray(t)){a.unshift(t[1]);t=t[0];}return [t,a];}
function build(h,a){return a.reduce((f,x)=>[f,x],h);}
const AR={S:3,K:2,I:1};
function step(t){const [h,a]=spine(t);const ar=AR[h];
if(ar&&a.length>=ar){let r;const rest=a.slice(ar);
if(h==='S')r=[[a[0],a[2]],[a[1],a[2]]];else r=a[0];
return [build(r,rest),true];}
for(let j=0;j<a.length;j++){const [n,c]=step(a[j]);if(c){const b=a.slice();b[j]=n;return [build(h,b),true];}}
return [t,false];}
function size(t,cap){let n=0;const st=[t];while(st.length){const u=st.pop();if(Array.isArray(u)){st.push(u[0],u[1]);}else{n++;if(n>cap)return n;}}return n;}
function render(el,t){
const segs=[],leaves=[];
function walk(u,x,y,ang,len){
if(!Array.isArray(u)){leaves.push([x,y,u,Math.max(0.35,Math.min(2.2,len*0.3))]);return;}
if(len<0.02)return;
const fa=ang+TF,fx=x+len*Math.cos(fa),fy=y-len*Math.sin(fa);
const aa=ang-TA,al=len*RA,ax=x+al*Math.cos(aa),ay=y-al*Math.sin(aa);
segs.push([x,y,fx,fy,0]);segs.push([x,y,ax,ay,1]);
walk(u[0],fx,fy,fa,len*RF);walk(u[1],ax,ay,aa,al);}
walk(t,0,0,Math.PI/2,10);
let mnx=0,mny=0,mxx=0,mxy=0;
const ext=(x,y)=>{if(x<mnx)mnx=x;if(x>mxx)mxx=x;if(y<mny)mny=y;if(y>mxy)mxy=y;};
segs.forEach(s=>{ext(s[0],s[1]);ext(s[2],s[3]);});leaves.forEach(l=>ext(l[0],l[1]));
const w=Math.max(mxx-mnx,8),h=Math.max(mxy-mny,8),p=Math.max(w,h)*0.08+3;
el.setAttribute('viewBox',`${mnx-p} ${mny-p} ${w+2*p} ${h+2*p}`);
let out='';
const sw='vector-effect="non-scaling-stroke"';
segs.forEach(s=>{out+=`<line x1="${s[0].toFixed(3)}" y1="${s[1].toFixed(3)}" x2="${s[2].toFixed(3)}" y2="${s[3].toFixed(3)}" stroke="${s[4]?'#378ADD':'#639922'}" stroke-width="${s[4]?1.2:1.6}" stroke-linecap="round" ${sw}/>`;});
leaves.forEach(([x,y,k,r])=>{
if(k==='S')out+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#D85A30"/>`;
else if(k==='K')out+=`<rect x="${x-r*1.4}" y="${y-r*0.45}" width="${r*2.8}" height="${r*0.9}" fill="#D85A30"/>`;
else if(k==='I')out+=`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#D85A30" stroke-width="1.5" ${sw}/>`;
else out+=`<rect x="${x-r*0.8}" y="${y-r*0.8}" width="${r*1.6}" height="${r*1.6}" fill="#888780"/>`;});
out+=`<circle cx="0" cy="0" r="${Math.max(w,h)*0.018+0.4}" fill="none" stroke="var(--text-secondary)" stroke-width="1" ${sw}/>`;
el.innerHTML=out;}
render(document.getElementById('p0'),parse('SKKx'));
render(document.getElementById('p1'),parse('Kx(Kx)'));
render(document.getElementById('p2'),parse('x'));
const states=[];let cur=parse('S(SS)SSS(SS(KK))');
for(let i=0;i<120;i++){const n=size(cur,3000);if(n>3000)break;states.push([cur,n]);const [nx,c]=step(cur);if(!c)break;cur=nx;}
const sl=document.getElementById('st'),ro=document.getElementById('ro'),big=document.getElementById('big');
sl.max=states.length-1;sl.value=Math.min(24,states.length-1);
function show(){const i=+sl.value;render(big,states[i][0]);ro.textContent=`step ${i} \u00b7 ${states[i][1]} leaves`;}
sl.addEventListener('input',show);show();
</script>
